<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encuestas Premium</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .survey-list { display: grid; gap: 0.75rem; margin-top: 0.75rem; }
    .survey-card {
      border: 1px solid rgba(128, 128, 128, 0.35);
      border-radius: 10px;
      padding: 0.9rem 1rem;
    }
    .survey-card h3 { margin: 0 0 0.5rem; font-size: 1.05rem; }
    .survey-row { display: flex; justify-content: space-between; gap: 1rem; margin: 0.2rem 0; }
    .survey-card button { margin-top: 0.6rem; width: 100%; }
    .toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .external-link { display: inline-block; margin: 0.5rem 0; font-size: 0.9rem; }
    #toast {
      position: fixed;
      left: 50%;
      bottom: 1.5rem;
      transform: translateX(-50%);
      padding: 0.8rem 1.2rem;
      border-radius: 10px;
      background: #1f8f4e;
      color: #fff;
      font-weight: 600;
      z-index: 50;
    }
  </style>
</head>
<body>

  <div id="auth-section" class="card">
    <h1>Encuestas Premium</h1>

    <form id="login-form">
      <strong>Iniciar sesión</strong>
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Contraseña" required />
      <button type="submit">Entrar</button>
    </form>

    <form id="register-form">
      <strong>Crear cuenta</strong>
      <input type="email" id="register-email" placeholder="Email" required />
      <input type="password" id="register-password" placeholder="Contraseña (mín. 6 caracteres)" required />
      <button type="submit">Registrarme</button>
    </form>
  </div>

  <div id="app-section" class="card app-wide hidden">
    <div class="topbar">
      <div>
        <div id="user-email" class="muted"></div>
        <div class="points"><span id="user-points">0</span> pts</div>
      </div>
      <button id="logout-btn" class="secondary">Cerrar sesión</button>
    </div>

    <!-- Panel principal: tarjetas de proveedores -->
    <div id="providers-view">
      <p>Elegí un proveedor para ver sus encuestas disponibles:</p>
      <div class="providers-grid">
        <button class="provider-card" data-provider="cpx">
          <span class="provider-name">CPX Research</span>
          <span class="provider-sub">Encuestas variadas</span>
        </button>
        <button class="provider-card" data-provider="theoremreach">
          <span class="provider-name">TheoremReach</span>
          <span class="provider-sub">Encuestas variadas</span>
        </button>
      </div>
    </div>

    <!-- Lista de encuestas de CPX, con el diseño de Vocea -->
    <div id="cpx-list-view" class="hidden">
      <div class="toolbar">
        <button id="cpx-back-btn" class="secondary">&larr; Proveedores</button>
        <button id="cpx-refresh-btn" class="secondary">Actualizar</button>
      </div>
      <h2>Encuestas disponibles</h2>
      <p id="cpx-status" class="muted"></p>
      <div id="cpx-list" class="survey-list"></div>
    </div>

    <!-- Vista de encuesta: se muestra al abrir una encuesta -->
    <div id="survey-view" class="hidden">
      <button id="back-btn" class="secondary">&larr; Volver</button>
      <a id="open-external" class="external-link" href="#" target="_blank" rel="noopener">¿No carga? Abrir en pestaña nueva</a>
      <iframe id="survey-frame" title="Encuestas"></iframe>
    </div>
  </div>

  <div id="toast" class="hidden" role="status"></div>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
